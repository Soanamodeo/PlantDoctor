<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Plant Doctor App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .animate-in { animation-duration: 500ms; animation-fill-mode: forwards; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .fade-in { animation-name: fadeIn; }
    .slide-in-from-bottom-4 { animation-name: slideUp; }
    .slide-in-from-right-4 { animation-name: slideRight; }
    .slide-in-from-top-2 { animation-name: slideDown; }
    .zoom-in-95 { animation-name: zoomIn95; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideRight { from { opacity: 0; transform: translateX(1rem); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-0.5rem); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn95 { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const iconPaths = {
      Camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
      Upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
      Sprout: '<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
      ShieldAlert: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
      Info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
      Leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
      Droplets: '<path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.9 7 2.9s-2.14 3.96-3.29 4.89S2 11.09 2 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 1 14 8c2 2.5 2 4.5 2 4.5"/><path d="M17 21.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S17 7.9 17 7.9s-2.14 3.96-3.29 4.89S12 16.09 12 17.25c0 2.22 1.8 4.05 4 4.05z"/>',
      XCircle: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
      CheckCircle2: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/>',
      RefreshCw: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
      Loader2: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
      MapPin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      ChevronDown: '<path d="m6 9 6 6 6-6"/>',
      ChevronUp: '<path d="m18 15-6-6-6 6"/>',
      Globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
      Ruler: '<path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z"/><path d="m14.5 12.5 2-2"/><path d="m11.5 9.5 2-2"/><path d="m8.5 6.5 2-2"/><path d="m17.5 15.5 2-2"/>',
      Lock: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      Edit2: '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>',
      AlertTriangle: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      Bug: '<rect width="8" height="14" x="8" y="6" rx="4"/><path d="m19 7-3 2"/><path d="m5 7 3 2"/><path d="m19 19-3-2"/><path d="m5 19 3-2"/><path d="M20 13h-4"/><path d="M4 13h4"/><path d="m10 4 1 2"/><path d="m14 4-1 2"/>',
      Save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>',
      ListIcon: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      ArrowLeft: '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
      Trash2: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
      History: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
      ZoomIn: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>',
      ZoomOut: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/>',
      KeyIcon: '<path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/>',
      Download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'
    };

    const Icons = {};
    for (const [name, path] of Object.entries(iconPaths)) {
      Icons[name] = ({ size = 24, className = "" }) => (
        <svg 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          width={size} 
          height={size} 
          className={className} 
          dangerouslySetInnerHTML={{ __html: path }} 
        />
      );
    }
    const { 
      Camera, Upload, Sprout, ShieldAlert, Info, Leaf, Droplets, XCircle, 
      CheckCircle2, RefreshCw, Loader2, MapPin, ChevronDown, ChevronUp, 
      Globe, Ruler, Lock, Edit2, AlertTriangle, Bug, Save, ListIcon, 
      ArrowLeft, Trash2, History, ZoomIn, ZoomOut, KeyIcon, Download 
    } = Icons;

    function App() {
      // 1. Settings & Persistence State
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('plant_doctor_api_key') || "");
      const [showApiModal, setShowApiModal] = useState(!localStorage.getItem('plant_doctor_api_key'));
      const [showApiHelp, setShowApiHelp] = useState(false);
      
      // 2. Navigation & View State
      const [view, setView] = useState('scan'); 
      const [savedPlants, setSavedPlants] = useState(() => {
        try { 
          return JSON.parse(localStorage.getItem('plant_doctor_saved')) || []; 
        } catch { 
          return []; 
        }
      });
      
      // 3. Selection & Management State
      const [updatingPlantId, setUpdatingPlantId] = useState(() => sessionStorage.getItem('plant_doctor_updating_id') || null);
      const [selectedPlant, setSelectedPlant] = useState(null);
      const [plantToDelete, setPlantToDelete] = useState(null);
      
      // 4. Analysis & Result State
      const [imageSrc, setImageSrc] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState(null);
      const [showMoreInfo, setShowMoreInfo] = useState(false);
      const [treatmentPref, setTreatmentPref] = useState('natural');
      
      // 5. Context State
      const [location, setLocation] = useState(() => localStorage.getItem('plant_doctor_location') || "");
      const [isLocationLocked, setIsLocationLocked] = useState(() => !!localStorage.getItem('plant_doctor_location'));

      // 6. Camera & Hardware Refs
      const [showCamera, setShowCamera] = useState(false);
      const fileInputRef = useRef(null);
      const cameraInputRef = useRef(null);
      const videoRef = useRef(null);
      const previewCanvasRef = useRef(null);
      const streamRef = useRef(null);
      const animationRef = useRef(null);
      
      const [zoom, setZoom] = useState(1);
      const zoomRef = useRef(1);
      const initialPinchDist = useRef(null);
      const initialZoomRef = useRef(1);
      const hasHardwareZoomRef = useRef(false);

      useEffect(() => {
        return () => stopCamera();
      }, []);

      useEffect(() => {
        if (showCamera && videoRef.current && streamRef.current) {
          const video = videoRef.current;
          video.srcObject = streamRef.current;
          const playVideo = async () => {
            try {
              await video.play();
              startDrawLoop();
            } catch (e) {
              console.error("Autoplay failed, retrying...", e);
              setTimeout(playVideo, 100);
            }
          };
          playVideo();
        }
      }, [showCamera]);

      useEffect(() => { 
        if (apiKey) localStorage.setItem('plant_doctor_api_key', apiKey); 
      }, [apiKey]);

      useEffect(() => {
        if (updatingPlantId) {
          sessionStorage.setItem('plant_doctor_updating_id', updatingPlantId);
        } else {
          sessionStorage.removeItem('plant_doctor_updating_id');
        }
      }, [updatingPlantId]);

      useEffect(() => { 
        localStorage.setItem('plant_doctor_location', location); 
      }, [location]);
      
      useEffect(() => {
        try { 
          localStorage.setItem('plant_doctor_saved', JSON.stringify(savedPlants)); 
        } catch (e) { 
          console.warn("Storage full", e); 
        }
      }, [savedPlants]);

      const triggerBackupDownload = (plantsToSave, currentKey, currentLocation) => {
        const data = { 
          apiKey: currentKey, 
          location: currentLocation, 
          savedPlants: plantsToSave 
        };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `plant-doctor-backup.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.apiKey) {
              setApiKey(data.apiKey);
              localStorage.setItem('plant_doctor_api_key', data.apiKey);
            }
            if (data.location) {
              setLocation(data.location);
              localStorage.setItem('plant_doctor_location', data.location);
            }
            if (data.savedPlants) {
              setSavedPlants(data.savedPlants);
              localStorage.setItem('plant_doctor_saved', JSON.stringify(data.savedPlants));
            }
            setShowApiModal(false);
          } catch (err) {
            alert("Error reading backup file.");
          }
        };
        reader.readAsText(file);
      };

      const compressImage = (dataUrl, callback) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let scale = 1;
          if (img.width > MAX_WIDTH) {
            scale = MAX_WIDTH / img.width;
          }
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = dataUrl;
      };
      
      const saveCurrentPlant = () => {
        if (!result) return;
        const plantData = { 
          ...result, 
          imageSrc, 
          lastUpdated: new Date().toISOString() 
        };
        
        let newPlants;
        if (updatingPlantId) {
          newPlants = savedPlants.map(p => p.id === updatingPlantId ? { ...p, ...plantData } : p);
          setUpdatingPlantId(null);
        } else {
          newPlants = [{ id: Date.now().toString(), ...plantData }, ...savedPlants];
        }
        
        setSavedPlants(newPlants);
        triggerBackupDownload(newPlants, apiKey, location);
        
        resetApp();
        setView('list');
      };

      const executeDelete = () => {
        if (!plantToDelete) return;
        const newPlants = savedPlants.filter(p => p.id !== plantToDelete);
        setSavedPlants(newPlants);
        triggerBackupDownload(newPlants, apiKey, location);
        setPlantToDelete(null);
        setView('list');
      };

      const startUpdate = (plant) => {
          setUpdatingPlantId(plant.id);
          setSelectedPlant(null);
          setView('scan');
          window.scrollTo(0, 0);
      };

      const analyzePlant = async (base64Data, mimeType) => {
        if (!apiKey) { 
          setShowApiModal(true); 
          return; 
        }
        
        setLoading(true); 
        setError(null); 
        setResult(null); 
        setShowMoreInfo(false);
        
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
          const prompt = `Expert Botanist & Turf Specialist: 1. isPlant 2. Name 3. Cat (Weed/Desirable/Lawn) 4. Health (Healthy/Sick) 5. diseaseOrPest 6. Short Desc 7. AdviceObj (natural, chemical, general) 8. growthLocation & averageSize. JSON response.`;
          
          const payload = {
            contents: [
              { 
                role: "user", 
                parts: [
                  { text: prompt }, 
                  { inlineData: { mimeType, data: base64Data } }
                ] 
              }
            ],
            generationConfig: { 
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  isPlant: { type: "BOOLEAN" },
                  name: { type: "STRING" },
                  scientificName: { type: "STRING" },
                  category: { type: "STRING" },
                  healthStatus: { type: "STRING" },
                  diseaseOrPest: { type: "STRING" },
                  description: { type: "STRING" },
                  actionableAdvice: {
                    type: "OBJECT",
                    properties: {
                      natural: { type: "ARRAY", items: { type: "STRING" } },
                      chemical: { type: "ARRAY", items: { type: "STRING" } },
                      general: { type: "ARRAY", items: { type: "STRING" } }
                    }
                  },
                  growthLocation: { type: "STRING" },
                  averageSize: { type: "STRING" }
                }
              }
            }
          };
          
          const response = await fetch(url, { 
            method: "POST", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(payload) 
          });
          
          const data = await response.json();
          if (data.error) throw new Error(data.error.message);
          
          const parsedResult = JSON.parse(data.candidates[0].content.parts[0].text);
          setResult(parsedResult);
          setTreatmentPref('natural');
        } catch (err) { 
          setError(err.message || "An error occurred during analysis."); 
        } finally { 
          setLoading(false); 
        }
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = () => {
          compressImage(reader.result, (comp) => {
            setImageSrc(comp);
            analyzePlant(comp.split(',')[1], 'image/jpeg');
          });
        };
        reader.readAsDataURL(file);
      };

      const resetApp = () => { 
        setImageSrc(null); 
        setResult(null); 
        setError(null); 
        setShowMoreInfo(false); 
        setUpdatingPlantId(null); 
        stopCamera(); 
      };

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              facingMode: { ideal: 'environment' }, 
              width: { ideal: 1920 }, 
              height: { ideal: 1080 } 
            } 
          });
          streamRef.current = stream;
          setShowCamera(true);
          
          const track = stream.getVideoTracks()[0];
          if (track.getCapabilities) {
            const caps = track.getCapabilities();
            hasHardwareZoomRef.current = !!caps.zoom;
            if (caps.zoom) {
              const defaultZoom = track.getSettings().zoom || 1;
              setZoom(defaultZoom);
              zoomRef.current = defaultZoom;
            }
          }
        } catch (err) { 
          cameraInputRef.current?.click(); 
        }
      };

      const stopCamera = () => {
        if (animationRef.current) cancelAnimationFrame(animationRef.current);
        if (streamRef.current) { 
          streamRef.current.getTracks().forEach(t => t.stop()); 
          streamRef.current = null; 
        }
        setShowCamera(false);
      };

      const startDrawLoop = () => {
        const draw = () => {
          if (!videoRef.current || !previewCanvasRef.current) return;
          const v = videoRef.current;
          const c = previewCanvasRef.current;
          
          if (c.width !== v.videoWidth) { 
            c.width = v.videoWidth; 
            c.height = v.videoHeight; 
          }
          
          const ctx = c.getContext('2d');
          const z = hasHardwareZoomRef.current ? 1 : zoomRef.current;
          const sw = v.videoWidth / z; 
          const sh = v.videoHeight / z;
          const sx = (v.videoWidth - sw) / 2; 
          const sy = (v.videoHeight - sh) / 2;
          
          ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
          animationRef.current = requestAnimationFrame(draw);
        };
        draw();
      };

      const handleZoomUpdate = (z) => {
        setZoom(z); 
        zoomRef.current = z;
        if (streamRef.current && hasHardwareZoomRef.current) {
          streamRef.current.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom: z }] });
        }
      };

      const getPinchDistance = (t) => Math.sqrt(Math.pow(t[0].clientX - t[1].clientX, 2) + Math.pow(t[0].clientY - t[1].clientY, 2));
      
      const handleTouchStart = (e) => { 
        if (e.touches.length === 2) { 
          initialPinchDist.current = getPinchDistance(e.touches); 
          initialZoomRef.current = zoomRef.current; 
        } 
      };
      
      const handleTouchMove = (e) => {
        if (e.touches.length === 2 && initialPinchDist.current) {
          e.preventDefault();
          const scale = getPinchDistance(e.touches) / initialPinchDist.current;
          handleZoomUpdate(Math.max(1, Math.min(initialZoomRef.current * scale, 5)));
        }
      };
      
      const handleTouchEnd = (e) => {
        if (e.touches.length < 2) {
          initialPinchDist.current = null;
        }
      };

      const capturePhoto = () => {
        if (previewCanvasRef.current) {
          const comp = previewCanvasRef.current.toDataURL('image/jpeg', 0.8);
          setImageSrc(comp);
          stopCamera();
          analyzePlant(comp.split(',')[1], 'image/jpeg');
        }
      };

      const renderPlantDetails = (d) => (
        <div className="animate-in slide-in-from-bottom-4 duration-500 space-y-4 mt-4">
          <div className="bg-white p-6 rounded-3xl shadow-md border-t-4" style={{ borderTopColor: d.category === 'Weed' ? '#ef4444' : (d.healthStatus === 'Sick' ? '#f59e0b' : '#10b981') }}>
            <div className="flex justify-between items-start">
              <div>
                <h2 className="text-2xl font-bold text-gray-800">{d.name || 'Unknown Plant'}</h2>
                <p className="text-sm italic text-gray-500">{d.scientificName}</p>
              </div>
              <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase ${d.category === 'Weed' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                {d.category}
              </span>
            </div>
            
            {d.healthStatus === 'Sick' && (
              <div className="bg-amber-50 p-3 rounded-xl mt-4 flex gap-3 text-amber-800 font-bold text-sm">
                <AlertTriangle size={20} className="shrink-0" /> 
                {d.diseaseOrPest} Alert!
              </div>
            )}
            
            <p className="text-gray-600 text-sm mt-4 leading-relaxed">{d.description}</p>
          </div>
          
          <div className="bg-white p-6 rounded-3xl shadow-md">
            <div className="flex items-center gap-2 mb-4">
              <Leaf size={20} className="text-green-600" />
              <h3 className="font-bold text-lg">Treatment Plan</h3>
            </div>
            
            {(d.category === 'Weed' || d.healthStatus === 'Sick') && (
              <div className="flex bg-gray-100 p-1 rounded-xl mb-4">
                {['natural', 'chemical'].map(type => (
                  <button 
                    key={type} 
                    onClick={() => setTreatmentPref(type)} 
                    className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${treatmentPref === type ? 'bg-white shadow-sm text-green-700' : 'text-gray-500 hover:text-gray-700'}`}
                  >
                    {type.charAt(0).toUpperCase() + type.slice(1)}
                  </button>
                ))}
              </div>
            )}
            
            <ul className="space-y-3">
              {(d.actionableAdvice?.[treatmentPref] || d.actionableAdvice?.general || []).map((a, i) => (
                <li key={i} className="flex gap-3 bg-gray-50 p-3 rounded-xl text-sm text-gray-700">
                  <Droplets size={16} className="text-blue-400 shrink-0" /> 
                  {a}
                </li>
              ))}
              {((d.actionableAdvice?.[treatmentPref] || d.actionableAdvice?.general || []).length === 0) && (
                 <li className="text-sm text-gray-500 italic p-3 text-center">No {treatmentPref} treatments found.</li>
              )}
            </ul>
          </div>
          
          <button 
            onClick={() => setShowMoreInfo(!showMoreInfo)} 
            className="w-full bg-white border border-gray-200 text-gray-700 font-bold py-4 px-6 rounded-2xl shadow-sm flex items-center justify-between"
          >
            <span className="flex items-center gap-2">
              <Info size={20} className="text-blue-500" /> 
              More Info
            </span>
            {showMoreInfo ? <ChevronUp size={20} /> : <ChevronDown size={20} />}
          </button>

          {showMoreInfo && (
            <div className="bg-blue-50/50 border border-blue-100 p-6 rounded-3xl space-y-4">
              <div>
                <h4 className="font-bold text-gray-800 mb-1 flex items-center gap-2">
                  <Globe size={18} className="text-blue-600" /> Natural Habitat
                </h4>
                <p className="text-sm text-gray-700">{d.growthLocation}</p>
              </div>
              <div>
                <h4 className="font-bold text-gray-800 mb-1 flex items-center gap-2">
                  <Ruler size={18} className="text-blue-600" /> Average Size
                </h4>
                <p className="text-sm text-gray-700">{d.averageSize}</p>
              </div>
            </div>
          )}
        </div>
      );

      return (
        <div className="min-h-screen font-sans pb-12 relative">
          
          {/* Delete Confirmation Modal */}
          {plantToDelete && (
            <div className="fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl animate-in zoom-in-95 duration-200">
                <div className="flex flex-col items-center text-center mb-6 mt-2">
                  <div className="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-4">
                    <Trash2 size={32} />
                  </div>
                  <h3 className="text-xl font-bold text-gray-800 mb-2">Are you sure?</h3>
                  <p className="text-sm text-gray-500">Do you really want to delete this plant? This action cannot be undone.</p>
                </div>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setPlantToDelete(null)} 
                    className="flex-1 bg-gray-100 text-gray-600 font-bold py-3.5 rounded-2xl hover:bg-gray-200 transition-colors"
                  >
                    No, Cancel
                  </button>
                  <button 
                    onClick={executeDelete} 
                    className="flex-1 bg-red-600 text-white font-bold py-3.5 rounded-2xl hover:bg-red-700 transition-colors shadow-lg shadow-red-600/30"
                  >
                    Yes, Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Settings & API Key Modal */}
          {showApiModal && (
            <div className="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center gap-3 mb-2">
                  <div className="bg-green-100 text-green-600 p-2 rounded-full">
                    <KeyIcon size={24} />
                  </div>
                  <h3 className="text-xl font-bold text-gray-800">Settings & Restore</h3>
                </div>
                
                {!localStorage.getItem('plant_doctor_api_key') && (
                  <div className="bg-blue-50 border border-blue-100 text-blue-800 p-3 rounded-xl text-sm mb-4 mt-3">
                    <strong>Welcome!</strong> New users must enter a free Google Gemini API key to continue.
                  </div>
                )}
                
                <p className="text-sm text-gray-600 mb-5 leading-relaxed mt-2">
                  Browsers occasionally clear local memory. Restore your saved plants and API key in one click below.
                </p>

                <label className="flex items-center justify-center bg-green-600 text-white font-bold py-4 rounded-xl cursor-pointer hover:bg-green-700 transition-colors mb-4 shadow-lg shadow-green-600/30">
                  <Upload size={20} className="mr-2" />
                  Restore from Backup File
                  <input type="file" accept=".json" onChange={importData} className="hidden" />
                </label>
                
                <div className="text-xs text-gray-500 mb-5 leading-relaxed bg-gray-50 p-3 rounded-xl border border-gray-100">
                  <strong>Tip:</strong> When restoring or searching your device for your data file, look for the exact name: <br/>
                  <code className="bg-white border border-gray-200 px-1.5 py-0.5 rounded text-gray-800 font-mono mt-1.5 inline-block">plant-doctor-backup.json</code>
                </div>

                <div className="flex items-center gap-4 mb-5">
                  <div className="h-px bg-gray-200 flex-1"></div>
                  <span className="text-xs font-bold text-gray-400 uppercase">Or edit manually</span>
                  <div className="h-px bg-gray-200 flex-1"></div>
                </div>

                <div className="flex justify-between items-end mb-1">
                  <label className="block text-xs font-bold text-gray-400">GEMINI API KEY</label>
                  <button 
                    onClick={() => setShowApiHelp(!showApiHelp)} 
                    className="text-blue-600 text-xs font-bold hover:underline"
                  >
                    What's an API?
                  </button>
                </div>
                
                {showApiHelp && (
                  <div className="bg-gray-50 border border-gray-200 p-4 rounded-xl text-sm text-gray-700 mb-4 animate-in slide-in-from-top-2">
                    An API key allows this app to communicate directly with Google's AI to identify your plants for free.<br/><br/>
                    1. Go to <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-600 underline font-bold">Google AI Studio</a>.<br/>
                    2. Sign in and click "Create API key".<br/>
                    3. Copy the key and paste it into the box below.
                  </div>
                )}

                <input 
                  type="password" 
                  value={apiKey} 
                  onChange={(e) => setApiKey(e.target.value)} 
                  placeholder="AIzaSy..." 
                  className="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:ring-2 focus:ring-green-500 outline-none shadow-inner" 
                />
                
                <div className="flex gap-3">
                  <button 
                    onClick={() => { localStorage.setItem('plant_doctor_api_key', apiKey); setShowApiModal(false); }} 
                    className="flex-1 bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-900 transition-colors shadow-md"
                  >
                    Save Key
                  </button>
                  {localStorage.getItem('plant_doctor_api_key') && (
                    <button 
                      onClick={() => setShowApiModal(false)} 
                      className="px-4 bg-gray-100 text-gray-600 font-bold rounded-xl hover:bg-gray-200 transition-colors"
                    >
                      Cancel
                    </button>
                  )}
                </div>
                
                <button 
                  onClick={() => triggerBackupDownload(savedPlants, apiKey, location)} 
                  className="w-full mt-5 text-xs font-bold text-gray-400 hover:text-green-600 transition-colors flex items-center justify-center gap-1"
                >
                  <Download size={14} /> Download current backup manually
                </button>
              </div>
            </div>
          )}

          {/* Top Navigation Bar */}
          <header className="bg-white shadow-sm pt-8 pb-4 px-6 rounded-b-3xl sticky top-0 z-10 flex items-center justify-between">
            <button 
              onClick={() => { view === 'detail' ? setView('list') : (resetApp(), setView('scan')) }} 
              className={`p-2 rounded-full ${view === 'scan' ? 'text-green-600 bg-green-50' : 'text-gray-400'}`}
            >
              {view === 'detail' ? <ArrowLeft size={24} /> : <Camera size={24} />}
            </button>
            <div className="flex items-center gap-2">
              <div className="bg-green-500 p-1.5 rounded-xl text-white shadow-md">
                <Sprout size={24} />
              </div>
              <h1 className="text-xl font-bold text-gray-800 tracking-tight">Plant Doctor</h1>
            </div>
            <div className="flex items-center gap-1">
              <button 
                onClick={() => setShowApiModal(true)} 
                className="p-2 text-gray-400"
              >
                <KeyIcon size={20} />
              </button>
              <button 
                onClick={() => { resetApp(); setView('list'); }} 
                className={`p-2 rounded-full ${view === 'list' || view === 'detail' ? 'text-green-600 bg-green-50' : 'text-gray-400'}`}
              >
                <ListIcon size={24} />
              </button>
            </div>
          </header>

          <main className="max-w-md mx-auto mt-6 px-4">
            
            {/* View: Scanner / Homepage */}
            {view === 'scan' && (
              <>
                {/* Active Camera View */}
                {showCamera && (
                  <div className="fixed inset-0 z-50 bg-black flex flex-col touch-none animate-in fade-in" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
                    <div className="flex-1 relative bg-black overflow-hidden flex items-center">
                      <video ref={videoRef} autoPlay playsInline muted className="hidden" />
                      <canvas ref={previewCanvasRef} className="w-full h-full object-contain" />
                      
                      {zoom === 1 && (
                        <div className="absolute top-16 left-1/2 -translate-x-1/2 bg-black/60 text-white px-4 py-2 rounded-full text-sm font-medium pointer-events-none">
                          Pinch to zoom
                        </div>
                      )}
                      
                      <div className="absolute bottom-6 left-0 w-full px-8 flex items-center gap-4 bg-gradient-to-t from-black/80 to-transparent pt-10">
                        <ZoomOut className="text-white w-5" />
                        <input 
                          type="range" 
                          min="1" 
                          max="5" 
                          step="0.1" 
                          value={zoom} 
                          onChange={(e) => handleZoomUpdate(parseFloat(e.target.value))} 
                          className="flex-1 accent-white" 
                        />
                        <ZoomIn className="text-white w-5" />
                      </div>
                    </div>
                    
                    <div className="bg-black pb-12 pt-6 px-10 flex justify-between items-center z-10">
                      <button 
                        onClick={stopCamera} 
                        className="text-white p-4 bg-white/10 rounded-full hover:bg-white/20 transition"
                      >
                        <XCircle size={32} />
                      </button>
                      <button 
                        onClick={capturePhoto} 
                        className="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1"
                      >
                        <div className="w-full h-full bg-white rounded-full active:bg-gray-300 transition" />
                      </button>
                      <div className="w-16" />
                    </div>
                  </div>
                )}
                
                {/* Pre-Scan Homepage UI */}
                {!imageSrc && !loading && !showCamera && (
                  updatingPlantId ? (
                    <div className="bg-white p-8 rounded-3xl shadow-xl text-center animate-in slide-in-from-bottom-4">
                      {(() => {
                        const p = savedPlants.find(plant => plant.id === updatingPlantId);
                        if (!p) {
                          setTimeout(() => setUpdatingPlantId(null), 0);
                          return null;
                        }
                        return (
                          <>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Update Plant Status</h2>
                            <p className="text-gray-500 text-sm mb-6">Take a new photo to see how this plant is doing today.</p>
                            
                            <div className="relative mb-6 inline-block">
                              <img src={p.imageSrc} className="w-32 h-32 object-cover rounded-3xl shadow-md border-4 border-white" />
                              <div className="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-blue-100 text-blue-800 px-4 py-1.5 rounded-full text-xs font-bold border border-blue-200 shadow-sm whitespace-nowrap flex items-center gap-1">
                                <History size={14} /> {p.name || 'Unknown'}
                              </div>
                            </div>
                            
                            <div className="space-y-4 mt-2">
                              <button 
                                onClick={startCamera} 
                                className="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 hover:bg-blue-700 transition"
                              >
                                <Camera size={20} /> 
                                Take New Photo
                              </button>
                              <button 
                                onClick={() => fileInputRef.current.click()} 
                                className="w-full bg-white border-2 text-gray-700 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-gray-50 transition"
                              >
                                <Upload size={20} className="text-gray-400" /> 
                                Upload from Gallery
                              </button>
                            </div>
                            <button 
                              onClick={() => { setUpdatingPlantId(null); setView('detail'); setSelectedPlant(p); }} 
                              className="mt-6 text-gray-400 font-bold text-sm hover:text-gray-600"
                            >
                              Cancel Update
                            </button>
                          </>
                        );
                      })()}
                    </div>
                  ) : (
                    <div className="bg-white p-8 rounded-3xl shadow-xl text-center animate-in slide-in-from-bottom-4">
                      <div className="w-24 h-24 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-6">
                        <Leaf className="text-green-500" size={40} />
                      </div>
                      <h2 className="text-xl font-bold text-gray-800 mb-2">Diagnose & Identify</h2>
                      <p className="text-gray-500 text-sm mb-6">Scan any plant, weed, or lawn area.</p>
                      
                      <div className="mb-8 text-left">
                        <label className="block text-sm font-semibold text-gray-700 mb-2">Location Context</label>
                        <div className="flex gap-2">
                          {isLocationLocked ? (
                            <div className="flex-1 bg-green-50 border border-green-200 rounded-2xl px-4 py-3 flex justify-between items-center">
                              <div className="flex items-center text-green-800">
                                <MapPin size={20} className="mr-3 text-green-600 shrink-0" />
                                <span className="truncate">{location}</span>
                              </div>
                              <button 
                                onClick={() => setIsLocationLocked(false)} 
                                className="text-green-600 bg-green-100 p-1.5 rounded-lg"
                              >
                                <Edit2 size={16} />
                              </button>
                            </div>
                          ) : (
                            <>
                              <div className="flex-1 flex items-center bg-gray-50 border rounded-2xl px-4 py-3">
                                <MapPin size={20} className="text-gray-400 mr-2 shrink-0"/>
                                <input 
                                  type="text" 
                                  value={location} 
                                  onChange={(e) => setLocation(e.target.value)} 
                                  placeholder="e.g. Seattle, WA" 
                                  className="bg-transparent border-none outline-none w-full text-gray-700" 
                                />
                              </div>
                              <button 
                                onClick={() => setIsLocationLocked(true)} 
                                disabled={!location.trim()} 
                                className="bg-green-600 disabled:bg-gray-300 text-white p-3 rounded-2xl transition"
                              >
                                <Lock size={20} />
                              </button>
                            </>
                          )}
                        </div>
                      </div>
                      
                      <div className="space-y-4">
                        <button 
                          onClick={startCamera} 
                          className="w-full bg-green-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg shadow-green-600/30 hover:bg-green-700 transition"
                        >
                          <Camera size={20} /> 
                          Take a Photo
                        </button>
                        <button 
                          onClick={() => fileInputRef.current.click()} 
                          className="w-full bg-white border-2 text-gray-700 font-bold py-4 rounded-2xl flex items-center justify-center gap-2 hover:bg-gray-50 transition"
                        >
                          <Upload size={20} className="text-gray-400" /> 
                          Upload from Gallery
                        </button>
                      </div>
                    </div>
                  )
                )}

                <input 
                  type="file" 
                  accept="image/*" 
                  capture="environment" 
                  ref={cameraInputRef} 
                  className="hidden" 
                  onChange={handleFileChange} 
                />
                <input 
                  type="file" 
                  accept="image/*" 
                  ref={fileInputRef} 
                  className="hidden" 
                  onChange={handleFileChange} 
                />
                
                {/* Result Processing / Display View */}
                {imageSrc && (
                  <div className="space-y-6 animate-in fade-in">
                    <div className="bg-white rounded-3xl p-3 shadow-xl relative overflow-hidden">
                      <img 
                        src={imageSrc} 
                        className={`w-full h-64 object-cover rounded-2xl transition-opacity ${loading ? 'opacity-50' : 'opacity-100'}`} 
                      />
                      {loading && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-white/30 backdrop-blur-sm">
                          <div className="bg-white p-4 rounded-full shadow-lg mb-3">
                            <Loader2 className="w-8 h-8 animate-spin text-green-600" />
                          </div>
                          <p className="font-bold text-gray-800 bg-white/90 px-4 py-1 rounded-full shadow">
                            Analyzing Plant...
                          </p>
                        </div>
                      )}
                    </div>
                    
                    {error && (
                      <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-2xl text-red-800 flex gap-3 font-bold">
                        <XCircle className="shrink-0 mt-0.5" /> 
                        <div>
                          <h3>Analysis Failed</h3>
                          <p className="text-sm font-normal">{error}</p>
                        </div>
                      </div>
                    )}
                    
                    {result && (
                      <>
                        {renderPlantDetails(result)}
                        {result.isPlant && (
                          <button 
                            onClick={saveCurrentPlant} 
                            className="w-full bg-green-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-600/20 mt-4 flex items-center justify-center gap-2 hover:bg-green-700 transition"
                          >
                            <Save size={20} /> 
                            {updatingPlantId ? 'Update Plant Status' : 'Save Plant & Backup'}
                          </button>
                        )}
                        <button 
                          onClick={resetApp} 
                          className="w-full bg-white border border-gray-200 text-gray-700 font-bold py-4 rounded-2xl mt-3 flex items-center justify-center gap-2 hover:bg-gray-50 transition"
                        >
                          <RefreshCw size={18} /> 
                          Cancel
                        </button>
                      </>
                    )}
                  </div>
                )}
              </>
            )}
            
            {/* View: Saved Plants List */}
            {view === 'list' && (
              <div className="space-y-4 animate-in fade-in">
                <h2 className="text-2xl font-bold text-gray-800 mb-4 px-2">My Saved Plants</h2>
                <div className="grid grid-cols-2 gap-4">
                  {savedPlants.length ? savedPlants.map(p => (
                    <div 
                      key={p.id} 
                      onClick={() => { setSelectedPlant(p); setView('detail'); }} 
                      className="bg-white rounded-3xl p-3 shadow-md border border-gray-100 cursor-pointer active:scale-95 transition-transform"
                    >
                      <div className="relative">
                        <img src={p.imageSrc} className="w-full h-32 object-cover rounded-2xl mb-3 bg-gray-100" />
                        <div className="absolute top-2 right-2 bg-white/90 backdrop-blur p-1.5 rounded-full shadow-sm">
                          {p.healthStatus === 'Sick' || p.category === 'Weed' ? (
                            <AlertTriangle size={14} className="text-amber-500" />
                          ) : (
                            <CheckCircle2 size={14} className="text-green-500" />
                          )}
                        </div>
                      </div>
                      <h3 className="font-bold text-gray-800 text-sm truncate px-1">
                        {p.name || 'Unknown'}
                      </h3>
                      <p className="text-[10px] text-gray-400 px-1 truncate">
                        {new Date(p.lastUpdated).toLocaleDateString()}
                      </p>
                    </div>
                  )) : (
                    <div className="col-span-2 bg-white p-10 rounded-3xl text-center shadow-sm">
                      <Leaf size={40} className="mx-auto text-gray-200 mb-4" />
                      <h3 className="font-bold text-gray-800 mb-2">No Plants Yet</h3>
                      <p className="text-gray-500 text-sm mb-4">Scan your first plant to track its health.</p>
                      <button 
                        onClick={() => { resetApp(); setView('scan'); }} 
                        className="bg-green-100 text-green-700 px-6 py-2 rounded-xl font-bold"
                      >
                        Start Scanning
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
            
            {/* View: Detailed view of a saved plant */}
            {view === 'detail' && selectedPlant && (
              <div className="space-y-6 animate-in slide-in-from-right-4">
                <div className="bg-white p-2 rounded-3xl shadow-xl">
                  <img src={selectedPlant.imageSrc} className="w-full h-64 object-cover rounded-2xl" />
                </div>
                {renderPlantDetails(selectedPlant)}
                <div className="flex gap-3 pt-2">
                  <button 
                    onClick={() => startUpdate(selectedPlant)} 
                    className="flex-1 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/20 flex justify-center items-center gap-2 hover:bg-blue-700 transition"
                  >
                    <RefreshCw size={20} /> 
                    Update
                  </button>
                  <button 
                    onClick={() => setPlantToDelete(selectedPlant.id)} 
                    className="flex-1 bg-red-50 text-red-600 font-bold py-4 rounded-2xl flex justify-center items-center gap-2 hover:bg-red-100 transition"
                  >
                    <Trash2 size={20} /> 
                    Delete
                  </button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }
    
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
